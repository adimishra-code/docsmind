name: DocsMind CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio flake8 mypy
        
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Type check with mypy
      run: mypy app/ --ignore-missing-imports || true
        
    - name: Run Pytest
      run: pytest tests/ -v
      env:
        DATABASE_URL: sqlite+aiosqlite:///:memory:
        SECRET_KEY: test_secret_key
        # Exclude OpenAI/Qdrant dependent tests or mock them in pytest

  frontend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: ESLint
      run: npm run lint || true
      
    - name: Type Check
      run: npx tsc --noEmit
      
    - name: Build Test
      run: npm run build

  docker-build-verify:
    needs: [backend-lint-test, frontend-lint-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Backend Docker Image
      run: docker build -t docsmind-backend:latest ./backend
      
    - name: Build Frontend Docker Image
      run: docker build -t docsmind-frontend:latest ./frontend
      
    - name: Run Security Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'docsmind-backend:latest'
        format: 'table'
        exit-code: '0' # Don't fail build for now
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
