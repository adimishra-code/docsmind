version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: docsmind
      POSTGRES_PASSWORD: docsmind
      POSTGRES_DB: docsmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsmind -d docsmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    volumes:
      - ./backend:/app  # Hot reload mount
    environment:
      - DATABASE_URL=postgresql+asyncpg://docsmind:docsmind@postgres:5432/docsmind
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - QDRANT_URL=http://qdrant:6333
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=llama3.2:3b
      - EMBEDDING_PROVIDER=sentence_transformers
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8006", "--reload", "--reload-dir", "/app/app"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://docsmind:docsmind@postgres:5432/docsmind
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - QDRANT_URL=http://qdrant:6333
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=llama3.2:3b
      - EMBEDDING_PROVIDER=sentence_transformers
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      target: builder
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host"]
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  redis_dev_data:
  qdrant_dev_data:
  ollama_data:
